spring.application.name: qltailieu-be
server:
  port: ${PORT}
spring:
  datasource:
    username: ${USERNAME_DB}
    password: ${PASSWORD_DB}
    url: ${URL_DB}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  main:
    allow-circular-references: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 215MB
      enabled: true
      # Threshold after which files are written to disk.
      file-size-threshold: 2KB
      #spring.servlet.multipart.location=D:/temp
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: "*"
            protocols: TLSv1.2
          connectiontimeout: 60000
          timeout: 60000
          writetimeout: 60000
        transport:
          protocol: smtp
jwt:
  key: ${JWT_KEY}
idea:
  max:
    intellisense:
      filesize: 2500
FRONTEND_URL: ${FRONTEND_URL}

